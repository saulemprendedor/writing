<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner 1/5 — El primer intento fracasó</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1117; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Ambient light: one teal source, upper right, same as the sites. -->
    <radialGradient id="amb" cx="72%" cy="12%" r="62%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <!-- The crystal that froze the graph. -->
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7de8db" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <!-- Film grain, kept very low so it reads as texture, not noise. -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117"/>
  <rect width="1920" height="1080" fill="url(#amb)"/>

  <!-- ============ The frozen agent graph ============ -->
  <g transform="translate(0,-40)">

    <!-- Edges still alive, dimming. -->
    <g stroke="#2dd4bf" fill="none" stroke-linecap="round">
      <path d="M470 470 L700 340"  stroke-opacity="0.42" stroke-width="1.6"/>
      <path d="M700 340 L960 415"  stroke-opacity="0.38" stroke-width="1.6"/>
      <path d="M470 470 L660 610"  stroke-opacity="0.34" stroke-width="1.5"/>
      <path d="M660 610 L960 415"  stroke-opacity="0.30" stroke-width="1.5"/>
      <path d="M960 415 L1180 300" stroke-opacity="0.26" stroke-width="1.4"/>
      <path d="M660 610 L900 690"  stroke-opacity="0.22" stroke-width="1.4"/>
      <path d="M960 415 L1120 560" stroke-opacity="0.20" stroke-width="1.3"/>
    </g>

    <!-- Edges that already went dark and broke apart. -->
    <g stroke="#39414d" fill="none" stroke-linecap="round" stroke-width="1.4">
      <path d="M1180 300 L1330 380" stroke-dasharray="3 26" stroke-opacity="0.85"/>
      <path d="M1120 560 L1300 630" stroke-dasharray="3 30" stroke-opacity="0.7"/>
      <path d="M900 690 L1090 745"  stroke-dasharray="3 34" stroke-opacity="0.55"/>
    </g>

    <!-- Nodes: bright at the core, cooling toward the edges. -->
    <g filter="url(#glow)">
      <circle cx="470"  cy="470" r="11" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-opacity="0.95"/>
      <circle cx="700"  cy="340" r="9"  fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-opacity="0.8"/>
      <circle cx="960"  cy="415" r="13" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="2.4" stroke-opacity="0.85"/>
      <circle cx="660"  cy="610" r="9"  fill="none" stroke="#2dd4bf" stroke-width="2.1" stroke-opacity="0.6"/>
    </g>
    <g>
      <circle cx="1180" cy="300" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-opacity="0.34"/>
      <circle cx="1120" cy="560" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-opacity="0.24"/>
      <circle cx="900"  cy="690" r="7" fill="none" stroke="#2dd4bf" stroke-width="1.7" stroke-opacity="0.20"/>
    </g>
    <!-- Nodes that stopped keeping up. -->
    <g fill="none" stroke="#39414d" stroke-width="1.8">
      <circle cx="1330" cy="380" r="7" stroke-opacity="0.9"/>
      <circle cx="1300" cy="630" r="6" stroke-opacity="0.75"/>
      <circle cx="1090" cy="745" r="6" stroke-opacity="0.6"/>
    </g>

    <!-- ============ The crystal encasing it ============ -->
    <g>
      <polygon points="392,300 1010,196 1268,392 1176,700 640,792 372,596"
               fill="url(#ice)" stroke="#cfeee9" stroke-opacity="0.13" stroke-width="1.4"/>
      <!-- Hairline fractures. -->
      <g stroke="#e9eef4" stroke-opacity="0.16" stroke-width="1" fill="none" stroke-linecap="round">
        <path d="M1010 196 L905 430 L640 792"/>
        <path d="M905 430 L1268 392"/>
        <path d="M905 430 L372 596"/>
        <path d="M905 430 L1176 700"/>
        <path d="M392 300 L905 430"/>
      </g>
      <g stroke="#2dd4bf" stroke-opacity="0.16" stroke-width="0.8" fill="none">
        <path d="M700 268 L812 512"/>
        <path d="M1120 268 L980 604"/>
      </g>
    </g>

    <!-- Fragments drifting off — the graph coming apart at the edge. -->
    <g stroke="#cfeee9" stroke-opacity="0.11" stroke-width="1.1" fill="url(#ice)">
      <polygon points="1352,300 1424,286 1440,344 1372,356"/>
      <polygon points="1452,452 1520,470 1496,528 1436,506"/>
      <polygon points="1400,660 1462,684 1428,724 1386,700"/>
      <polygon points="1560,372 1600,388 1584,424 1548,406"/>
    </g>
  </g>

  <!-- Cold breath under the structure, so the lower half is not dead space. -->
  <ellipse cx="880" cy="800" rx="520" ry="60" fill="#2dd4bf" fill-opacity="0.05" filter="url(#softglow)"/>

  <!-- ============ Brand footer — identical on all five ============ -->
  <line x1="120" y1="880" x2="1800" y2="880" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1"/>

  <text x="120" y="948" fill="#e9eef4" font-size="34" font-weight="700" letter-spacing="7.5">SAÚL HERNÁNDEZ</text>
  <text x="120" y="990" fill="#7d8792" font-size="21" font-weight="500" letter-spacing="3.6">TECH LEAD — IA APLICADA AL DESARROLLO</text>
  <text x="120" y="1028" fill="#4a5158" font-size="19" letter-spacing="1.2">saul@botsmith.ai</text>

  <text x="1800" y="948" fill="#2dd4bf" font-size="26" font-weight="700" letter-spacing="6" text-anchor="end">DEV GENIUS</text>
  <text x="1800" y="988" fill="#4a5158" font-size="20" letter-spacing="4" text-anchor="end">1 / 5</text>

  <!-- Grain last, over everything. -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.045" style="mix-blend-mode:overlay"/>
</svg>
</body>
</html>
